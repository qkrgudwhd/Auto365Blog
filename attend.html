<script>
/* ============================================================
   출석 엔진 — 랜딩페이지·365blog·e_book_maker 1기

   저장소를 어댑터로 분리했다.
   지금은 localStorage, Firebase 키를 받으면 Store 만 교체하면 된다.

   판정 규칙
     A(시작) + B(종료) 둘 다 → 1.0점 (출석)
     하나만                  → 0.5점 (부분)
     없음                    → 0.0점 (결석)
     수료 = 6회 × 80% = 4.8점 이상
   ============================================================ */
(function (global) {
  'use strict';

  const KEY = 'att_db_v1';
  const WEEKS = 6;
  const PASS_RATE = 0.8;
  const PASS_SCORE = WEEKS * PASS_RATE;      // 4.8
  const CODE_TTL_MIN = 10;                   // 코드 유효 10분

  // ---------- 저장소 어댑터 ----------
  // localStorage 가 막힌 환경(시크릿 모드 · data: URL · 일부 사내망)에서도
  // 메모리로 계속 동작하게 한다. Firebase 로 갈 때 이 객체만 교체하면 된다.
  let _mem = null;
  let _useMem = false;

  function canLS() {
    try {
      const k = '__t' + Date.now();
      localStorage.setItem(k, '1'); localStorage.removeItem(k);
      return true;
    } catch (e) { return false; }
  }

  const Store = {
    mode() { return _useMem ? 'memory' : 'localStorage'; },
    load() {
      if (!_useMem && !canLS()) _useMem = true;
      if (_useMem) return _mem ? JSON.parse(JSON.stringify(_mem)) : blank();
      try { return JSON.parse(localStorage.getItem(KEY)) || blank(); }
      catch (e) { _useMem = true; return blank(); }
    },
    save(db) {
      // 규칙이 네 필드를 모두 검사하므로 빠진 것을 채워서 저장한다
      db.codes = db.codes || [];
      db.attendance = db.attendance || [];
      db.students = db.students || [];
      db.certificates = db.certificates || [];
      if (_useMem) { _mem = JSON.parse(JSON.stringify(db)); return; }
      try { localStorage.setItem(KEY, JSON.stringify(db)); }
      catch (e) { _useMem = true; _mem = JSON.parse(JSON.stringify(db)); }
    },
    reset() {
      _mem = null;
      if (_useMem) return;
      try { localStorage.removeItem(KEY); } catch (e) { _useMem = true; }
    }
  };
  // 네 필드는 항상 존재해야 한다.
  // 보안 규칙이 각 필드 크기를 검사하는데, 필드가 없으면 오류로 '거부'된다.
  function blank() { return { codes: [], attendance: [], students: [], certificates: [] }; }

  // ---------- 유틸 ----------
  function now() { return Date.now(); }
  function pad4(n) { return String(n).padStart(4, '0'); }

  /** 읽기 쉬운 4자리 숫자. 0000/1111 같이 헷갈리는 건 피한다. */
  function makeCode() {
    let c;
    do { c = pad4(Math.floor(Math.random() * 10000)); }
    while (/^(\d)\1{3}$/.test(c));
    return c;
  }

  // ---------- 강사: 코드 발급 ----------
  /**
   * @param {number} week 1~6
   * @param {'A'|'B'} type A=시작 확인, B=종료 확인
   * @param {number} [ttlMin]
   */
  function issueCode(week, type, ttlMin) {
    if (!(week >= 1 && week <= WEEKS)) throw new Error('회차는 1~6 입니다');
    if (type !== 'A' && type !== 'B') throw new Error('코드 종류는 A 또는 B 입니다');
    const db = Store.load();
    // 같은 회차·종류의 이전 코드는 즉시 만료 (중복 유효 방지)
    db.codes.forEach(c => {
      if (c.week === week && c.type === type) c.expires_at = now() - 1;
    });
    const code = {
      code: makeCode(),
      week, type,
      issued_at: now(),
      expires_at: now() + (ttlMin || CODE_TTL_MIN) * 60000
    };
    db.codes.push(code);
    Store.save(db);
    return code;
  }

  // ---------- 수강생: 출석 찍기 ----------
  /**
   * @returns {{ok:boolean, reason?:string, week?:number, type?:string}}
   */
  function mark(userId, codeStr, opt) {
    opt = opt || {};
    if (!userId) return { ok: false, reason: 'NOT_LOGGED_IN' };
    const db = Store.load();
    const c = db.codes.find(x => x.code === String(codeStr).trim());
    if (!c) return { ok: false, reason: 'BAD_CODE' };
    if (now() > c.expires_at) return { ok: false, reason: 'EXPIRED' };

    const dup = db.attendance.find(
      a => a.user_id === userId && a.week === c.week && a.type === c.type);
    if (dup) return { ok: false, reason: 'ALREADY', week: c.week, type: c.type };

    db.attendance.push({
      user_id: userId, week: c.week, type: c.type,
      marked_at: now(), method: opt.method || 'code'
    });
    Store.save(db);
    return { ok: true, week: c.week, type: c.type };
  }

  // ---------- 강사: 손으로 출석 넣기 ----------
  function markManual(userId, week, type, memo) {
    if (!userId) throw new Error('수강생을 고르세요');
    const db = Store.load();
    const dup = db.attendance.find(
      a => a.user_id === userId && a.week === week && a.type === type);
    if (dup) return { ok: false, reason: 'ALREADY' };
    db.attendance.push({
      user_id: userId, week, type,
      marked_at: now(), method: 'manual', memo: memo || ''
    });
    Store.save(db);
    return { ok: true };
  }

  // ---------- 집계 ----------
  /** 한 사람의 회차별 점수와 총점 */
  function scoreOf(userId) {
    const db = Store.load();
    const mine = db.attendance.filter(a => a.user_id === userId);
    const weeks = [];
    let total = 0;
    for (let w = 1; w <= WEEKS; w++) {
      const hasA = mine.some(a => a.week === w && a.type === 'A');
      const hasB = mine.some(a => a.week === w && a.type === 'B');
      const s = (hasA && hasB) ? 1 : (hasA || hasB) ? 0.5 : 0;
      weeks.push({ week: w, A: hasA, B: hasB, score: s,
                   label: s === 1 ? '출석' : s === 0.5 ? '부분' : '결석' });
      total += s;
    }
    return {
      user_id: userId, weeks, total,
      rate: total / WEEKS,
      passed: total >= PASS_SCORE,
      need: Math.max(0, +(PASS_SCORE - total).toFixed(1))
    };
  }

  /** 특정 회차의 실시간 현황 */
  function sessionStatus(week, userIds) {
    const db = Store.load();
    return (userIds || []).map(u => {
      const hasA = db.attendance.some(a => a.user_id === u && a.week === week && a.type === 'A');
      const hasB = db.attendance.some(a => a.user_id === u && a.week === week && a.type === 'B');
      return { user_id: u, A: hasA, B: hasB,
               state: (hasA && hasB) ? 'done' : (hasA || hasB) ? 'partial' : 'none' };
    });
  }

  /** 수료 대상자 */
  function certifiable(userIds) {
    return (userIds || []).map(scoreOf).filter(s => s.passed);
  }

  /** 2회 연속 결석 — 이탈 위험 신호 */
  function atRisk(userIds, upToWeek) {
    const out = [];
    (userIds || []).forEach(u => {
      const s = scoreOf(u);
      for (let w = 2; w <= (upToWeek || WEEKS); w++) {
        if (s.weeks[w - 1].score === 0 && s.weeks[w - 2].score === 0) {
          out.push({ user_id: u, weeks: [w - 1, w] });
          break;
        }
      }
    });
    return out;
  }

  // ---------- 출석 링크 (온라인 강의 주력) ----------
  function attendUrl(base, code) {
    return base + '?c=' + encodeURIComponent(code);
  }
  function codeFromUrl(search) {
    const m = /[?&]c=([^&]+)/.exec(search || '');
    return m ? decodeURIComponent(m[1]) : null;
  }

  // ---------- 수료증 ----------
  // 주의: 수료증은 '이 과정을 들었다'는 확인서다. 자격증이 아니다.
  //       국가공인·자격 취득 같은 표현을 쓰면 자격기본법 문제가 된다.
  const CERT_PREFIX = 'HK-2026-1기-';

  function makeToken() {
    let s = '';
    const c = 'ABCDEFGHJKMNPQRSTUVWXYZ23456789';   // 헷갈리는 0·O·1·I 제외
    for (let i = 0; i < 10; i++) s += c[Math.floor(Math.random() * c.length)];
    return s;
  }

  /** 수료 조건을 만족하면 수료증을 발급한다. 이미 있으면 그대로 돌려준다. */
  function issueCertificate(userId) {
    const db = Store.load();
    db.certificates = db.certificates || [];
    const has = db.certificates.find(c => c.user_id === userId);
    if (has) return { ok: true, already: true, cert: has };

    const s = scoreOf(userId);
    if (!s.passed) {
      return { ok: false, reason: 'NOT_QUALIFIED', total: s.total, need: s.need };
    }
    const seq = db.certificates.length + 1;
    const cert = {
      user_id: userId,
      cert_no: CERT_PREFIX + String(seq).padStart(3, '0'),
      verify_token: makeToken(),
      attend_score: s.total,
      attend_weeks: s.weeks.filter(w => w.score > 0).length,
      full_weeks: s.weeks.filter(w => w.score === 1).length,
      perfect: s.total === WEEKS,
      issued_at: now()
    };
    db.certificates.push(cert);
    Store.save(db);
    return { ok: true, already: false, cert };
  }

  function listCertificates() {
    return (Store.load().certificates || []).slice();
  }

  /** 진위 확인 — 발급번호 + 토큰이 맞아야 한다 */
  function verifyCertificate(certNo, token) {
    const c = (Store.load().certificates || [])
      .find(x => x.cert_no === String(certNo).trim());
    if (!c) return { ok: false, reason: 'NOT_FOUND' };
    if (c.verify_token !== String(token).trim().toUpperCase()) {
      return { ok: false, reason: 'BAD_TOKEN' };
    }
    return { ok: true, cert: c };
  }

  function revokeCertificate(certNo) {
    const db = Store.load();
    db.certificates = (db.certificates || []).filter(c => c.cert_no !== certNo);
    Store.save(db);
    return { ok: true };
  }

  global.Attendance = {
    WEEKS, PASS_SCORE, CODE_TTL_MIN,
    Store, issueCode, mark, markManual,
    scoreOf, sessionStatus, certifiable, atRisk,
    issueCertificate, listCertificates, verifyCertificate, revokeCertificate,
    attendUrl, codeFromUrl,
    _makeCode: makeCode
  };
})(window);

</script>
<script>
/* ============================================================
   Firebase 저장소 어댑터

   attendance.js 의 Store 를 이것으로 갈아끼우면
   여러 사람의 기록이 한곳(Firestore)에 모인다.

   쓰는 법
     1) 아래 firebaseConfig 에 별님 설정값을 붙여넣는다
     2) 페이지에서 이 파일을 attendance.js 보다 "먼저" 불러온다
     3) await AttendanceFirebase.connect()  → 연결되면 Store 자동 교체

   설계 원칙
     - attendance.js 의 로직은 한 줄도 안 고친다
     - 연결 실패하면 기존 localStorage 로 자동 폴백 (수업이 멈추면 안 됨)
   ============================================================ */
(function (global) {
  'use strict';

  // ── ① 여기에 별님 설정값을 붙여넣으세요 ───────────────────
  const firebaseConfig = {
    apiKey:            "AIzaSyDb0d-nwXgNyx5s8MycT2QGbW9pRZDlnvg",
    authDomain:        "gen-lang-client-0074040813.firebaseapp.com",
    projectId:         "gen-lang-client-0074040813",
    storageBucket:     "gen-lang-client-0074040813.firebasestorage.app",
    messagingSenderId: "542737958820",
    appId:             "1:542737958820:web:d71f5d77b1c6cc650c2331"
  };

  // 이 강의 한 기수의 문서 하나에 전부 담는다.
  // 20명 × 6주 = 수백 건이라 문서 하나(1MB 한도)로 충분하고,
  // 읽기/쓰기 횟수가 줄어 무료 티어를 거의 안 쓴다.
  const DOC_PATH = ['courses', '2026-1기'];

  const SDK = 'https://www.gstatic.com/firebasejs/10.12.2/';

  let db = null, ref = null, cache = null, ready = false;

  function configured() {
    return !String(firebaseConfig.projectId).includes('〔');
  }

  function blank() { return { codes: [], attendance: [], students: [], certificates: [] }; }

  /** 연결. 실패하면 false 를 돌려주고 기존 저장소를 그대로 쓴다. */
  async function connect() {
    if (!configured()) {
      console.warn('[Firebase] 설정값이 아직 비어 있습니다. localStorage 로 계속합니다.');
      return false;
    }
    try {
      const [{ initializeApp }, fs, au] = await Promise.all([
        import(SDK + 'firebase-app.js'),
        import(SDK + 'firebase-firestore.js'),
        import(SDK + 'firebase-auth.js')
      ]);
      const app = initializeApp(firebaseConfig);

      // 익명 로그인 — 보안 규칙에서 '인증된 사람만' 조건을 걸기 위해 필요하다.
      // 수강생은 로그인 화면을 볼 일이 없다. 페이지를 열면 자동으로 처리된다.
      const auth = au.getAuth(app);
      await new Promise(function (resolve, reject) {
        au.onAuthStateChanged(auth, function (u) {
          if (u) return resolve(u);
          au.signInAnonymously(auth).then(resolve).catch(reject);
        });
      });

      db = fs.getFirestore(app);
      ref = fs.doc(db, DOC_PATH[0], DOC_PATH[1]);

      const snap = await fs.getDoc(ref);
      cache = snap.exists() ? snap.data() : blank();
      if (!snap.exists()) await fs.setDoc(ref, cache);

      // 다른 사람이 출석하면 강사 화면이 자동으로 갱신된다
      fs.onSnapshot(ref, function (s) {
        if (!s.exists()) return;
        cache = s.data();
        if (typeof global.onAttendanceChange === 'function') {
          try { global.onAttendanceChange(cache); } catch (e) {}
        }
      });

      // ── Store 교체 ──
      const A = global.Attendance;
      if (!A) throw new Error('attendance.js 를 먼저 불러와야 합니다');
      A.Store.mode = function () { return 'firebase'; };
      A.Store.load = function () { return JSON.parse(JSON.stringify(cache || blank())); };
      A.Store.save = function (data) {
        // 보안 규칙이 네 필드를 모두 검사한다. 하나라도 없으면 쓰기가 거부된다.
        data.codes = data.codes || [];
        data.attendance = data.attendance || [];
        data.students = data.students || [];
        data.certificates = data.certificates || [];
        cache = JSON.parse(JSON.stringify(data));
        fs.setDoc(ref, cache).catch(function (e) {
          console.error('[Firebase] 저장 실패 — 화면에는 반영되었으나 서버에 안 갔습니다', e);
          if (typeof global.onAttendanceSaveError === 'function') global.onAttendanceSaveError(e);
        });
      };
      A.Store.reset = function () {
        cache = blank();
        return fs.setDoc(ref, cache);
      };

      ready = true;
      console.log('[Firebase] 연결됨 —', firebaseConfig.projectId);
      return true;
    } catch (e) {
      var hint = '';
      var code = (e && (e.code || e.message)) || '';
      if (/permission|insufficient/i.test(code)) {
        hint = ' → 보안 규칙을 아직 안 넣으셨습니다. 콘솔 Firestore → 규칙 에 붙여넣으세요.';
      } else if (/admin-restricted|operation-not-allowed/i.test(code)) {
        hint = ' → Authentication 에서 "익명" 로그인을 켜셔야 합니다.';
      } else if (/network|unavailable/i.test(code)) {
        hint = ' → 인터넷 연결을 확인하세요.';
      }
      console.error('[Firebase] 연결 실패. localStorage 로 계속합니다.' + hint, e);
      global.__fbError = code + hint;
      return false;
    }
  }

  global.AttendanceFirebase = {
    connect: connect,
    isReady: function () { return ready; },
    isConfigured: configured,
    config: firebaseConfig,
    docPath: DOC_PATH.join('/')
  };
})(window);

</script>
<script>
var A = window.Attendance;
var NAME_KEY = 'att_my_name_v1';

function myName(){
  try { return localStorage.getItem(NAME_KEY) || ''; } catch(e){ return window.__name || ''; }
}
function setMyName(v){
  try { localStorage.setItem(NAME_KEY, v); } catch(e){ window.__name = v; }
}
function el(html){ document.getElementById('stage').innerHTML = html; }

function start(){
  var code = A.codeFromUrl(location.search);
  if (!myName()) return askName(code);
  if (code) return submit(code);
  askCode();
}

function askName(code){
  el('<div class="big">👋</div>'
   + '<h2>처음이시네요</h2>'
   + '<p class="d">신청하실 때 쓰신 <b>이름</b>을 적어주세요.<br>다음부터는 안 물어봅니다.</p>'
   + '<div class="lbl">이름</div>'
   + '<input class="name" id="nm" placeholder="예: 홍길동">'
   + '<button id="go">확인</button>');
  document.getElementById('nm').focus();
  document.getElementById('go').onclick = function(){
    var v = document.getElementById('nm').value.trim();
    if (!v){ alert('이름을 적어주세요'); return; }
    setMyName(v);
    if (code) submit(code); else askCode();
  };
}

function askCode(){
  el('<div class="big">🔢</div>'
   + '<h2>출석 코드를 넣어주세요</h2>'
   + '<p class="d">' + myName() + '님, 화면이나 채팅방의 <b>4자리 숫자</b>를 넣으세요.</p>'
   + '<input id="cd" maxlength="4" inputmode="numeric" placeholder="0000">'
   + '<button id="go">출석하기</button>'
   + '<button class="sub" id="chg">이름 바꾸기</button>');
  var cd = document.getElementById('cd');
  cd.focus();
  cd.addEventListener('keydown', function(e){ if (e.key==='Enter') submit(cd.value); });
  document.getElementById('go').onclick = function(){ submit(cd.value); };
  document.getElementById('chg').onclick = function(){ setMyName(''); askName(null); };
}

function submit(code){
  var r = A.mark(myName(), code, { method:'link' });
  if (r.ok) return done(r);
  var m = {
    BAD_CODE:  ['❌','코드가 맞지 않습니다','숫자를 다시 확인해 주세요. 채팅방의 최신 코드를 쓰셔야 합니다.'],
    EXPIRED:   ['⏰','시간이 지났습니다','이 코드는 만료되었습니다. 강사님께 새 코드를 요청해 주세요.'],
    ALREADY:   ['✅','이미 출석하셨습니다', (r.week||'')+'주차 '+(r.type||'')+' 출석이 이미 기록되어 있습니다.'],
    NOT_LOGGED_IN: ['👤','이름이 없습니다','이름을 먼저 적어주세요.']
  }[r.reason] || ['⚠','알 수 없는 오류','잠시 후 다시 시도해 주세요.'];
  var cls = (r.reason==='ALREADY') ? 'ok' : (r.reason==='EXPIRED' ? 'wn' : 'ng');
  el('<div class="big">'+m[0]+'</div>'
   + '<h2>'+m[1]+'</h2>'
   + '<div class="box '+cls+'">'+m[2]+'</div>'
   + '<button id="again">코드 다시 넣기</button>');
  document.getElementById('again').onclick = askCode;
}

function done(r){
  var s = A.scoreOf(myName());
  el('<div class="big">🎉</div>'
   + '<h2>출석 완료</h2>'
   + '<div class="box ok"><b>'+myName()+'</b>님<br>'
   + r.week+'주차 '+(r.type==='A'?'시작':'종료')+' 출석이 기록되었습니다</div>'
   + '<p class="d">지금까지 <b>'+s.total.toFixed(1)+'점</b> / 수료 기준 4.8점<br>'
   + (s.passed ? '<b style="color:var(--ok)">수료 기준을 넘으셨습니다</b>'
               : '앞으로 <b>'+s.need.toFixed(1)+'점</b> 더 필요합니다') + '</p>'
   + '<button class="sub" id="again">다른 코드 넣기</button>');
  document.getElementById('again').onclick = askCode;
}

document.addEventListener('DOMContentLoaded', function(){
  el('<div class="big">&#8987;</div><h2>잠시만요</h2><p class="d">연결하는 중입니다...</p>');
  var go = function(){ start(); };
  if (window.AttendanceFirebase) {
    window.AttendanceFirebase.connect().then(go).catch(go);
  } else { go(); }
});
window.__S__ = { start:start, submit:submit, setMyName:setMyName, myName:myName };
</script>
</body></html>
